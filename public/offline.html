<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f4f4f2">
<title>Sin conexión · GastoApp</title>
<style>
  body { margin: 0; min-height: 100dvh; display: grid; place-items: center; background: #f4f4f2; color: #16181d; font-family: -apple-system, BlinkMacSystemFont, system-ui, sans-serif; text-align: center; padding: 24px; box-sizing: border-box; }
  main { display: flex; flex-direction: column; align-items: center; gap: 12px; max-width: 320px; }
  img { border-radius: 16px; }
  h1 { margin: 0; font-size: 24px; }
  p { margin: 0; color: #6e6e73; font-size: 15px; line-height: 1.4; }
  button { margin-top: 8px; min-height: 48px; padding: 0 24px; border: 0; border-radius: 16px; background: #0f766e; color: #fff; font: inherit; font-size: 17px; font-weight: 600; }
</style>
</head>
<body>
<main>
  <img src="/icons/icon-192.png" alt="" width="64" height="64">
  <h1>Sin conexión</h1>
  <p>No hay internet en este momento. Tus datos están seguros; vuelve a intentar cuando tengas señal.</p>
  <button type="button" onclick="location.reload()">Reintentar</button>
</main>
</body>
</html>
